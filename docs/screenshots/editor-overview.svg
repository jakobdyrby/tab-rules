<g font-family="Segoe UI, sans-serif" fill="#233a32"><text x="48" y="58" font-size="24" font-weight="600">Tab Rules</text><text x="48" y="114" font-size="34">A place for every tab.</text><text x="48" y="150" font-size="16" fill="#6f7b70">URL rules for native Chrome tab groups. Local. Simple. Yours.</text>
<rect x="48" y="181" width="944" height="57" rx="10" fill="#edf2e9"/><text x="70" y="216" font-size="15">✓ Automatic grouping</text><text x="355" y="216" font-size="15">✓ Respect existing groups</text><text x="692" y="216" font-size="15">Keep groups in rule order</text>
